[project]
name = "comfyui-lato2"
description = "Low-poly remeshing with LATO.2: dense generated meshes (TRELLIS.2, Hunyuan3D, scans) to clean, artist-like low-poly meshes. Windows and Linux, nothing to compile."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Nothing for ComfyUI's own environment: LATO.2 runs in its own (install_lato2.py).
dependencies = []

[project.urls]
Repository = "https://github.com/sakalond/ComfyUI-LATO2"
Documentation = "https://github.com/sakalond/ComfyUI-LATO2#readme"
"Bug Tracker" = "https://github.com/sakalond/ComfyUI-LATO2/issues"

[tool.comfy]
PublisherId = "sakalond"
DisplayName = "ComfyUI-LATO2"
Icon = ""
includes = []

[tool.pytest.ini_options]
testpaths = ["tests"]
