[project]
name = "comfyui-lato2"
description = "Low-poly remeshing with LATO.2: dense generated meshes (TRELLIS.2, Hunyuan3D, scans) to clean, artist-like low-poly meshes. Windows and Linux, nothing to compile. After installing, run install_lato2.py once (see the README)."
version = "0.1.1"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Nothing for ComfyUI's own environment: LATO.2 runs in its own (install_lato2.py).
dependencies = []
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/sakalond/ComfyUI-LATO2"
Documentation = "https://github.com/sakalond/ComfyUI-LATO2#readme"
"Bug Tracker" = "https://github.com/sakalond/ComfyUI-LATO2/issues"

[tool.comfy]
PublisherId = "sakalond"
DisplayName = "ComfyUI-LATO2"
Icon = "https://raw.githubusercontent.com/sakalond/ComfyUI-LATO2/main/docs/images/icon.png"
Banner = "https://raw.githubusercontent.com/sakalond/ComfyUI-LATO2/main/docs/images/banner.png"
includes = []

[tool.pytest.ini_options]
testpaths = ["tests"]
